version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: animoon_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: postgres # Base por defecto
    ports:
      - "5433:5432"
    volumes:
      - animoon_pgdata:/var/lib/postgresql/data
      - ./backend/database/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: animoon_redis
    restart: always
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: animoon_backend
    restart: always
    env_file:
      - .env
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=password
      - REDIS_URL=redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: sh -c "python backend/create_tables.py && uvicorn backend.api.main:app --host 0.0.0.0 --port 8000 --reload"
    volumes:
      - ./backend:/app/backend
      - ./security:/app/security

  chat_server:
    build: .
    container_name: animoon_chat
    restart: always
    env_file:
      - .env
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=password
      - REDIS_URL=redis://redis:6379/0
    ports:
      - "8765:8765"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: sh -c "python backend/chat/chat_server.py"
    volumes:
      - ./backend:/app/backend
      - ./security:/app/security

  beto_worker:
    build:
      context: .
      dockerfile: backend/beto_worker/Dockerfile
    container_name: animoon_beto_worker
    restart: always
    env_file:
      - .env
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=password
      - REDIS_URL=redis://redis:6379/0
      - BETO_MODEL_DIR=/app/proyecto_pln/output/training_results_v5/mejor_modelo/modelo_comprimido
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: python backend/beto_worker/worker.py
    volumes:
      - ./backend:/app/backend
      - ./security:/app/security
      - ./proyecto_pln:/app/proyecto_pln

volumes:
  animoon_pgdata:
